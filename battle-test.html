<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#b7c9b2">
<title>軍營保衛戰｜獨立測試</title>
<link rel="preload" as="fetch" href="./assets/characters/cadet/cadet-green.glb?v=120" crossorigin="anonymous">
<link rel="stylesheet" href="./src/ui/playtest.css?v=077">
<link rel="stylesheet" href="./src/ui/campCombat.css?v=8">
<link rel="stylesheet" href="./src/battle-test/battle.css?v=2">
<link rel="stylesheet" href="./src/battle-test/talentLab.css?v=3">
<link rel="stylesheet" href="./src/battle-test/weaponLab.css?v=1">
<link rel="stylesheet" href="./src/battle-test/settlement.css?v=3">
<style>
body.battle-official #battleGodToggle,
body.battle-official #battleTalentLab,
body.battle-official #battleWeaponLab,
body.battle-official .battle-back{display:none!important}
body.battle-official .battle-intro-kicker,
body.battle-official .battle-intro-sub,
body.battle-official .battle-intro-card p,
body.battle-official #battleStart,
body.battle-official #battleLoading{display:none!important}
body.battle-official .battle-intro-card{
 background:transparent;border:0;box-shadow:none;padding:0;width:auto;max-width:100%
}
body.battle-official .battle-intro-card h1{
 margin:0;font-size:clamp(26px,7vw,38px);letter-spacing:.035em
}
/* Hide the game HUD while the official attack is still loading. */
body.battle-official:not(.battle-loaded) #battleExit,
body.battle-official:not(.battle-loaded) #minimap,
body.battle-official:not(.battle-loaded) #battleReportNow{display:none!important}
</style>
<link rel="stylesheet" href="./src/ui/gameTouchGuard.css?v=1">
<script src="./src/ui/gameTouchGuard.js?v=1" defer></script>
</head>
<body class="battle-test">
<canvas id="world" aria-label="軍營保衛戰 3D 場景"></canvas>
<button id="minimap" type="button" aria-label="開啟軍營地圖"><canvas id="miniCanvas" width="224" height="224"></canvas></button>
<section id="worldMap" class="world-map" role="dialog" aria-label="軍營地圖" aria-modal="true" hidden>
 <div class="world-map-panel">
  <header class="world-map-header"><div><strong>軍營保衛戰</strong><small>彈藥庫防線 · 藍色箭頭代表玩家</small></div>
   <button id="closeWorldMap" type="button" aria-label="關閉地圖">✕</button>
  </header>
  <div class="world-map-body"><div class="map-canvas-holder"><canvas id="worldMapCanvas" aria-label="軍營平面地圖"></canvas></div></div>
 </div>
</section>
<div id="floatingStick" aria-hidden="true"><div class="stick-base"><div id="stickThumb" class="stick-thumb"></div></div></div>
<div id="notice" role="status" hidden></div>
<div id="debug" hidden></div>
<div id="fatal" role="alert" hidden><strong>測試版載入失敗</strong><p id="errorText"></p><button id="retry" type="button">重新載入</button></div>
<div id="battleHUD" hidden>
 <span id="battleWave">第 1 波</span>
 <span id="battleRemaining">敵軍 0</span>
 <span id="battleAllies">友軍 5 / 5</span>
</div>
<button id="battleGodToggle" type="button" aria-pressed="false" hidden>無敵：關</button>
<div id="battleIntro" role="dialog" aria-label="軍營保衛戰">
 <div class="battle-intro-card">
  <div class="battle-intro-kicker">獨立測試版 · v23</div>
  <h1>軍營保衛戰</h1>
  <p>與 5 名友軍防守營區。敵軍從南、西、餐廳東側圍牆外分五路進攻，北側不進攻；每 25 秒增援一波，不等上一波清完。第一波 10 名徒手紅軍。</p>
  <div class="battle-intro-sub">拳頭、手槍、步槍與手榴彈均可測試。右側可手動換彈；彈匣用盡會自動換彈。左側可分別測試手槍／步槍 Lv.1～5，以及全部正負天賦等級。</div>
  <button id="battleStart" type="button">開始防守</button>
  <div id="battleLoading" hidden><span id="battleLoadText">準備軍營場景…</span><div class="battle-progress"><i id="battleLoadBar"></i></div></div>
  <a href="./index.html" class="battle-back">返回正式軍營</a>
 </div>
</div>
<div id="battleWaveBanner" hidden aria-live="polite"></div>
<details id="battleWeaponLab" aria-label="武器升級測試選單" hidden>
 <summary>武器等級測試 <span id="battleWeaponSummary">手槍 5 · 步槍 5</span></summary>
 <div id="battleWeaponBody"></div>
</details>
<details id="battleTalentLab" aria-label="戰鬥天賦實驗室">
 <summary>天賦測試 <span id="battleTalentCount" class="btl-count">0 / 36</span></summary>
 <div id="battleTalentBody" class="btl-inner"></div>
</details>
<div id="battleTalentStatus" aria-live="polite"></div>
<div id="battleTalentToast" class="btl-announce" role="status" hidden></div>
<button id="battleReload" type="button" aria-label="手動更換彈匣" hidden>換彈</button>
<button id="battleGrenade" type="button" aria-label="投擲手榴彈" hidden>榴彈</button>

<button id="battleExit" type="button" aria-label="退出戰場">← 退出</button>
<button id="battleReportNow" type="button" aria-label="結束防守並查看戰報" hidden>結算</button>
<script type="module" src="./src/battle-test/bootstrap.js?v=26"></script>
</body>
</html>
