<!doctype html>
<html lang="zh-Hant"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#162e23"><title>國軍模擬器｜實彈射擊鑑測</title>
<link rel="stylesheet" href="./shooting-paper.css?v=156"><link rel="stylesheet" href="./src/ui/armyProgression.css?v=2">
<script src="./src/systems/armyProgression.js?v=11" defer></script>
<link rel="stylesheet" href="./src/ui/gameTouchGuard.css?v=1">
<script src="./src/ui/gameTouchGuard.js?v=1" defer></script>
</head><body data-army-minigame="shooting">
<script type="module" src="./src/systems/minigameQuickExit.js?v=192"></script>
<canvas id="world3d" aria-label="國軍三維射擊訓練場"></canvas>
<canvas id="shootingOverlay" aria-label="拖曳控制步槍瞄準"></canvas>
<div id="hud" hidden>
 <div class="hudTop">
  <div class="hudPanel"><small>剩餘秒數</small><b id="timeDisplay">45.0</b></div>
  <div class="hudPanel"><small>上靶 / 已射</small><b><span id="hitsDisplay">0</span><span class="hudSep"> / </span><span id="shotsDisplay">0</span></b></div>
 </div>
 <div class="shootStageHud"><div id="stageHud">第 1 / 5 關 · 0 名友軍</div><strong id="stageHitsHud">上靶 0 / 5</strong></div>
 <div id="hitFlash" aria-live="polite"></div>
 <div class="controls">
  <div class="left"><div class="bullets" id="ammoDisplay">10 / 10</div><button id="zoomBtn">◎ 開鏡</button><button id="collectBtn" disabled>收靶紙</button></div>
  <button id="shootBtn">射擊</button>
 </div>
 <button id="muteBtn" aria-label="切換音效">🔊</button>
</div>
<div id="shootTransition" class="shootTransition" role="status" aria-live="polite" hidden></div>
<div id="startScreen" class="screen">
 <div class="panel introPanel">
  <div class="eyebrow">國軍射擊鑑測</div>
  <div class="introIcon" aria-hidden="true">🎯</div>
  <h1>報告班長！<br>我真的有在瞄。</h1>
  <p class="introCopy">每關 10 發，上靶 5 發過關。友軍從第 2 關開始干擾。</p>
  <div class="introHint">上滑抬槍 · 點「開鏡」放大</div>
  <div class="shootStagesIntro">
   <div class="shootStageHeader"><strong>五關鑑測</strong><small id="shootProgressNote">已完成 0 / 5 關</small></div>
   <div class="shootStageChoices" id="shootStageChoices" aria-label="五關歷史通關紀錄，僅供檢視"></div>
   <div class="shootStageTitle" id="shootStageTitle">五關連續鑑測 · 一律從第1關開始</div>
   <p class="shootStageDetail" id="shootStageDetail">上靶5發過關，未過關就直接結算，不可接關</p>
  </div>
  <div id="loadStatus" role="status">正在載入軍營…</div>
  <button id="startBtn" class="mainBtn" disabled>準備射擊…</button>
  <button id="shootGalleryIntro" class="secondaryBtn" type="button">🏅 成就圖鑑</button>
  <button class="backBtn secondaryBtn">返回軍營</button>
 </div>
</div>
<div id="resultScreen" class="screen" hidden>
 <div class="panel resultPanel">
  <div class="resultHeading"><div>
   <h1 id="resultTitle">射擊結算</h1>
   <div id="resultRank" class="resultRank">等待鑑定</div>
  </div></div>
  <div class="shootStageOutcome" id="shootStageOutcome">等待鑑測結果</div>
  <div class="shootScorebox">
   <div class="shootScorePrimary">
    <small>本次總分</small>
    <div class="shootScoreNumber"><strong id="shootScore">0</strong><span>/ 100</span></div>
   </div>
   <div class="shootScoreRank"><span id="shootGrade">待評</span><strong id="shootHistoryBest">歷史最高 0 分</strong></div>
  </div>
  <div class="shootSectionHead shootRunHeading"><strong>逐關成績</strong></div>
  <div class="shootRunRows" id="shootRunRows" aria-label="五關成績紀錄"></div>
  <div class="resultSummary">
   <div class="resultMain"><small>上靶</small><strong id="resultHits">0</strong><span>/ <b id="resultShots">0</b> 發</span></div>
   <div class="resultAccuracy"><small>命中率</small><strong id="resultRate">0%</strong></div>
  </div>
  <div class="shootAchSection">
   <div class="shootSectionHead"><strong>本次成就</strong><small id="shootAchMeta">達成 0 項</small></div>
   <div class="shootAchGrid" id="shootAchCards"></div>
   <button id="shootGalleryResult" class="shootGalleryButton" type="button">🏅 成就圖鑑</button>
  </div>
  <div class="officerComment"><small>班長講評</small><p id="reportText"></p></div>
  <div class="shootResultActions">
   <button class="backBtn secondaryBtn">返回軍營</button>
  </div>
 </div>
</div>
<script type="module" src="./shooting-paper-world.js?v=149"></script>
<script src="./shooting-paper-report.js?v=156"></script>
<script src="./shooting-paper.js?v=156"></script>
</body></html>
