<!doctype html>
<html lang="zh-Hant"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#172a20">
<title>軍歌鑑測｜七句接唱</title>
<link rel="stylesheet" href="./singing-memory-test.css?v=9">
</head><body>
<main class="app gameCompact">
 <header class="top">
  <div class="brand">軍歌鑑測 <span>v0.9</span></div>
  <a class="back" href="./index.html" aria-label="返回軍營">退出</a>
 </header>
 <section class="controls" id="controlsPanel" aria-label="軍歌鑑測遊戲">
  <div class="line"><span class="tag" id="stageTag">載入中</span><span id="takeCount">1 / 7</span></div>
  <div class="words" id="words">國家有綱常，軍隊有軍紀</div>
  <div class="phraseProgress" aria-label="七句進度">
   <span id="phraseStep1" class="active" aria-label="第一句">1</span>
   <span id="phraseStep2" aria-label="第二句">2</span>
   <span id="phraseStep3" aria-label="第三句">3</span>
   <span id="phraseStep4" aria-label="第四句">4</span>
   <span id="phraseStep5" aria-label="第五句">5</span>
   <span id="phraseStep6" aria-label="第六句">6</span>
   <span id="phraseStep7" aria-label="第七句">7</span>
  </div>
  <div class="boardShell">
   <div class="board" id="board" aria-label="音準與時間軸">
    <div class="ylabels"><span>高</span><span>低</span></div>
    <svg id="graph" viewBox="0 0 800 240" preserveAspectRatio="none" aria-label="旋律示範與演唱軌跡">
     <g id="gridLines"></g>
     <path id="guideLine" d="" fill="none" stroke="#f2d39b" stroke-width="10" stroke-linecap="butt" stroke-linejoin="miter"/>
     <path id="yourLine" d="" fill="none" stroke="#e8828e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
     <line id="playhead" x1="0" x2="0" y1="0" y2="240" stroke="#faf8e5" stroke-width="2" stroke-dasharray="5 5"/>
     <circle id="controlDot" cx="0" cy="120" r="11" fill="#fa9294" stroke="#fff" stroke-width="2" visibility="hidden"/>
    </svg>
    <div id="countdown" class="countdown" hidden aria-live="off">
     <div class="countdownCore"><strong id="countdownWord">3</strong><small id="countdownLabel">換你唱</small></div>
    </div>
    <div class="boardOverlay" id="boardOverlay">原版人聲載入中…</div>
    <div class="timeline" id="timeline"></div>
   </div>
   <div class="pitchControl" id="pitchControl">
    <span class="pitchHigh">高 ↑</span>
    <div class="pitchRail" id="pitchRail" role="slider" tabindex="0" aria-label="上下拖動調整音高，玩家倒數期間即可預先調整" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50" aria-orientation="vertical">
     <div class="pitchTrack"></div>
     <div class="pitchThumb" id="pitchThumb"><span>↕</span></div>
    </div>
    <span class="pitchLow">低 ↓</span>
   </div>
  </div>
  <div class="actionArea">
   <button id="mainButton" class="primary" type="button">開始</button>
   <button id="skipButton" type="button" hidden disabled>重新聽示範</button>
  </div>
  <div class="feedback" id="feedback" hidden>
   <div class="feedbackTitle"><span id="finalRank">F 級</span><strong id="finalScore">0 分</strong></div>
   <p id="comment"></p>
   <div id="phraseScores" class="phraseScores">總回顧</div>
   <div class="feedbackActions">
    <button id="replayButton" type="button">重播總回顧</button>
    <button id="compareButton" type="button">查看音準</button>
   </div>
   <div class="phraseCompare">
    <button id="comparePhrase1" type="button">1</button>
    <button id="comparePhrase2" type="button">2</button>
    <button id="comparePhrase3" type="button">3</button>
    <button id="comparePhrase4" type="button">4</button>
    <button id="comparePhrase5" type="button">5</button>
    <button id="comparePhrase6" type="button">6</button>
    <button id="comparePhrase7" type="button">7</button>
   </div>
  </div>
 </section>
 <div hidden aria-hidden="true" class="internalOnly">
  <span id="speech"></span><i id="mouth"></i><span id="hint"></span>
  <span id="voiceMode"></span><span id="voiceInfo"></span><button id="previewClip" type="button" disabled>試聽</button>
 </div>
</main>
<script src="./singing-memory-test.js?v=9" defer></script>
</body></html>
