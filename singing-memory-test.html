<!doctype html>
<html lang="zh-Hant"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#17372a">
<title>軍歌鑑測｜跟著班長唱</title>
<link rel="stylesheet" href="./singing-memory-test.css?v=10">
</head><body>
<main class="app">
 <header class="top">
  <span class="brand">軍歌鑑測 <small>v1.0</small></span>
  <a class="back" href="./index.html">退出</a>
 </header>
 <section class="controls" id="controlsPanel">
  <section class="singStage" aria-label="音準挑戰">
   <div class="stageMeta">
    <span class="tag" id="stageTag">載入中</span>
    <span id="takeCount" class="count">1 / 7</span>
   </div>
   <div class="words" id="words">國家有綱常，軍隊有軍紀</div>
   <div class="phraseProgress" aria-label="七句進度">
    <span id="phraseStep1" class="active">1</span>
    <span id="phraseStep2">2</span>
    <span id="phraseStep3">3</span>
    <span id="phraseStep4">4</span>
    <span id="phraseStep5">5</span>
    <span id="phraseStep6">6</span>
    <span id="phraseStep7">7</span>
   </div>
   <div class="boardShell">
    <div class="board" id="board" aria-label="音準與時間軸">
     <div class="ylabels"><span>高</span><span>低</span></div>
     <svg id="graph" viewBox="0 0 800 240" preserveAspectRatio="none" aria-label="班長金色階梯音高與你的紅色演唱線">
      <g id="gridLines"></g>
      <path id="guideLine" d="" fill="none" stroke="#f6d49b" stroke-width="10" stroke-linecap="butt" stroke-linejoin="miter"/>
      <path id="yourLine" d="" fill="none" stroke="#ec9094" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <line id="playhead" x1="0" x2="0" y1="0" y2="240" stroke="#f7f2d9" stroke-width="2" stroke-dasharray="5 5"/>
      <circle id="controlDot" cx="0" cy="120" r="11" fill="#ed9094" stroke="#fff" stroke-width="2" visibility="hidden"/>
     </svg>
     <div id="countdown" class="countdown" hidden>
      <div class="countdownCore"><strong id="countdownWord">3</strong><small id="countdownLabel">準備開唱</small></div>
     </div>
     <div class="boardOverlay" id="boardOverlay">載入原版人聲…</div>
     <div class="timeline" id="timeline"></div>
    </div>
    <div class="pitchControl">
     <span class="pitchHigh">高 ↑</span>
     <div class="pitchRail" id="pitchRail" role="slider" tabindex="0" aria-label="右側上下拖動音準" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50" aria-orientation="vertical">
      <div class="pitchTrack"></div>
      <div class="pitchThumb" id="pitchThumb">↕</div>
     </div>
     <span class="pitchLow">低 ↓</span>
    </div>
   </div>
   <div class="actionArea">
    <button id="mainButton" class="primary" type="button">開始挑戰</button>
    <button id="skipButton" type="button" hidden disabled>重新聽示範</button>
   </div>
  </section>
  <section class="coachStage" id="coachStage" aria-label="班長反應">
   <div class="coachArt">
    <svg class="coachSvg" viewBox="0 0 250 295" preserveAspectRatio="xMidYMax meet" role="img" aria-label="卡通國軍班長">
     <ellipse cx="125" cy="280" rx="103" ry="12" fill="#0c2319" opacity=".35"/>
     <path d="M31 276 Q30 188 59 177 L99 165 L152 165 L195 181 Q219 196 220 276Z" fill="#284b35" stroke="#162f25" stroke-width="5"/>
     <path d="M58 186 L35 223 L52 237" stroke="#365b41" stroke-width="8" stroke-linecap="round" fill="none"/>
     <path d="M193 190 L214 224 L197 237" stroke="#365b41" stroke-width="8" stroke-linecap="round" fill="none"/>
     <path d="M107 164 L107 183 L124 204 L142 183 L142 164" fill="#d5a07d" stroke="#7c5948" stroke-width="3"/>
     <path d="M103 175 L125 205 L85 196" fill="#527451" stroke="#213f2f" stroke-width="3"/>
     <path d="M146 175 L125 205 L163 196" fill="#527451" stroke="#213f2f" stroke-width="3"/>
     <path d="M125 205 L125 277" stroke="#173424" stroke-width="3"/>
     <circle cx="136" cy="229" r="3.5" fill="#b0a97b"/>
     <circle cx="136" cy="254" r="3.5" fill="#b0a97b"/>
     <rect x="164" y="213" width="32" height="24" rx="4" fill="#b8b283" stroke="#172d20" stroke-width="2"/>
     <text x="180" y="230" text-anchor="middle" font-size="17" font-weight="900" fill="#20392b">班</text>
     <path d="M72 182 L90 198 M180 183 L163 199" stroke="#789077" stroke-width="4" stroke-linecap="round"/>
     <ellipse cx="73" cy="126" rx="11" ry="19" fill="#cf9474" stroke="#805443" stroke-width="3"/>
     <ellipse cx="177" cy="126" rx="11" ry="19" fill="#cf9474" stroke="#805443" stroke-width="3"/>
     <path d="M74 92 Q76 55 125 54 Q171 56 176 96 L176 130 Q173 171 126 179 Q80 173 74 134Z" fill="#dba783" stroke="#8b614c" stroke-width="4"/>
     <path d="M82 108 Q97 100 111 107" stroke="#533f32" stroke-width="6" stroke-linecap="round"/>
     <path d="M141 107 Q155 100 169 108" stroke="#533f32" stroke-width="6" stroke-linecap="round"/>
     <g class="coachEyes"><ellipse cx="102" cy="119" rx="4.5" ry="5.5" fill="#26342c"/><ellipse cx="153" cy="119" rx="4.5" ry="5.5" fill="#26342c"/></g>
     <path d="M126 125 L121 145 Q127 149 133 145" fill="none" stroke="#ad7458" stroke-width="3" stroke-linecap="round"/>
     <path class="coachSmile" d="M109 158 Q126 171 144 158" fill="none" stroke="#713e38" stroke-width="4" stroke-linecap="round"/>
     <ellipse id="mouth" class="coachMouth" cx="126" cy="159" rx="10" ry="6" fill="#743c37"/>
     <path d="M77 93 Q69 68 87 47 Q110 26 150 41 Q180 49 183 83 L174 93 Q127 85 77 93Z" fill="#1b3e2e" stroke="#102b20" stroke-width="5"/>
     <path d="M74 88 Q110 81 178 87 Q161 100 103 98 Q80 96 74 88Z" fill="#173527" stroke="#0a2119" stroke-width="3"/>
     <path d="M112 49 L131 44 L140 59 L125 69 L108 59Z" fill="#d6bb72" stroke="#655532" stroke-width="2"/>
     <path d="M116 55 L133 55 M124 49 L124 63" stroke="#765f34" stroke-width="2"/>
    </svg>
   </div>
   <div class="coachContent">
    <div class="coachCaption">班長評語</div>
    <strong class="coachGrade" id="reactionGrade">READY</strong>
    <div class="coachSpeech" id="speech">耳朵借我用一下。唱完一句，我就評一次。</div>
    <div class="coachSmall" id="coachMiniScore"></div>
    <div class="feedback" id="feedback" hidden>
     <div class="feedbackTitle"><span id="finalRank">F 級</span><strong id="finalScore">0 分</strong></div>
     <p id="comment"></p>
     <div id="phraseScores" class="phraseScores"></div>
     <div class="feedbackActions">
      <button id="replayButton" type="button">重播總回顧</button>
      <button id="compareButton" type="button">查看音準</button>
     </div>
     <div class="phraseCompare">
      <button id="comparePhrase1" type="button">1</button>
      <button id="comparePhrase2" type="button">2</button>
      <button id="comparePhrase3" type="button">3</button>
      <button id="comparePhrase4" type="button">4</button>
      <button id="comparePhrase5" type="button">5</button>
      <button id="comparePhrase6" type="button">6</button>
      <button id="comparePhrase7" type="button">7</button>
     </div>
    </div>
   </div>
  </section>
 </section>
 <div hidden aria-hidden="true" class="internalOnly">
  <span id="hint"></span><span id="voiceMode"></span><span id="voiceInfo"></span>
  <button id="previewClip" type="button" disabled>試聽</button>
 </div>
</main>
<script src="./singing-memory-test.js?v=10" defer></script>
</body></html>
